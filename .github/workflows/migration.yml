name: Database Migration
on:
  push:
    branches: [main]
    paths: ['backend/prisma/**']

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Dependencies
        run: npm ci

      - name: Create SSH Tunnel to Private RDS
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          # Opens the tunnel: maps local 3307 to RDS 3306 via EC2 Jump Server
          ssh -i private_key.pem -o StrictHostKeyChecking=no -f -N -L 3307:${{ secrets.RDS_ENDPOINT }}:3306 ec2-user@${{ secrets.EC2_PUBLIC_IP }}
          sleep 5 # Wait for tunnel to stabilize

      - name: Deploy to RDS
        run: |
          # Use 'migrate deploy' to avoid the Shadow Database error
          npx prisma migrate resolve --applied 0_init || true
          npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}